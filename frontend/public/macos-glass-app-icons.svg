<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2200" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">HarshOS glass app icons</title>
  <desc id="desc">Six dark futuristic macOS-style glassmorphism application icons for Resume, Experience, Projects, Education, Achievements, and Contact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080d1c"/>
      <stop offset=".52" stop-color="#111329"/>
      <stop offset="1" stop-color="#090b18"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".42" stop-color="#a4b8e8" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".58"/>
      <stop offset=".3" stop-color="#93a4db" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#5ce1e6"/>
      <stop offset=".52" stop-color="#6c9cff"/>
      <stop offset="1" stop-color="#b28cff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#49dce2"/>
      <stop offset="1" stop-color="#b1f8ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#8062ff"/>
      <stop offset="1" stop-color="#d1baff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000510" flood-opacity=".7"/>
    </filter>
    <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8da0df" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="iconClip"><rect width="440" height="440" rx="104"/></clipPath>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>
  <circle cx="230" cy="180" r="240" fill="#536dff" opacity=".11" filter="url(#blur)"/>
  <circle cx="1370" cy="900" r="260" fill="#9c55ff" opacity=".1" filter="url(#blur)"/>
  <path d="M0 860C320 720 470 1030 760 850S1250 710 1600 880" fill="none" stroke="#62e9ee" stroke-opacity=".08" stroke-width="2"/>

  <!-- Shared icon frame: 440 x 440 -->
  <g transform="translate(120 90)" filter="url(#shadow)">
    <rect width="440" height="440" rx="104" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="2"/>
    <g clip-path="url(#iconClip)"><ellipse cx="110" cy="25" rx="270" ry="125" fill="#fff" opacity=".1" transform="rotate(-18 110 25)"/></g>
    <path d="M72 350C165 402 302 400 370 328" fill="none" stroke="#5ce1e6" stroke-opacity=".22" stroke-width="2"/>
    <g transform="translate(100 88)">
      <path d="M53 0h126l64 64v188H53c-29 0-53-24-53-53V53C0 24 24 0 53 0Z" fill="#b5c7f5" fill-opacity=".12" stroke="url(#cyan)" stroke-width="4"/>
      <path d="M179 0v65h64" fill="#fff" fill-opacity=".13" stroke="url(#cyan)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M48 145h140M48 181h110" stroke="#d9e7ff" stroke-opacity=".65" stroke-width="10" stroke-linecap="round"/>
      <path d="M48 217h72" stroke="#5ce1e6" stroke-width="10" stroke-linecap="round" filter="url(#glowCyan)"/>
      <circle cx="206" cy="218" r="21" fill="#6f5dff" fill-opacity=".65" filter="url(#glowPurple)"/>
    </g>
    <text x="220" y="390" text-anchor="middle" fill="#dce7ff" font-family="system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="2">RESUME</text>
  </g>

  <g transform="translate(580 90)" filter="url(#shadow)">
    <rect width="440" height="440" rx="104" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="2"/>
    <g clip-path="url(#iconClip)"><ellipse cx="100" cy="25" rx="270" ry="125" fill="#fff" opacity=".1" transform="rotate(-18 100 25)"/></g>
    <path d="M72 350C165 402 302 400 370 328" fill="none" stroke="#936fff" stroke-opacity=".22" stroke-width="2"/>
    <g transform="translate(94 118)">
      <rect x="19" y="51" width="234" height="150" rx="28" fill="#b5c7f5" fill-opacity=".12" stroke="url(#purple)" stroke-width="5"/>
      <path d="M19 93h234M99 51l18-34h52l18 34" fill="none" stroke="url(#cyanPurple)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M91 117h90" stroke="#dbe7ff" stroke-opacity=".7" stroke-width="11" stroke-linecap="round"/>
      <path d="M109 152h54" stroke="#5ce1e6" stroke-width="11" stroke-linecap="round" filter="url(#glowCyan)"/>
      <circle cx="235" cy="53" r="13" fill="#5ce1e6" filter="url(#glowCyan)"/>
    </g>
    <text x="220" y="390" text-anchor="middle" fill="#dce7ff" font-family="system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="2">EXPERIENCE</text>
  </g>

  <g transform="translate(1040 90)" filter="url(#shadow)">
    <rect width="440" height="440" rx="104" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="2"/>
    <g clip-path="url(#iconClip)"><ellipse cx="100" cy="25" rx="270" ry="125" fill="#fff" opacity=".1" transform="rotate(-18 100 25)"/></g>
    <path d="M72 350C165 402 302 400 370 328" fill="none" stroke="#5ce1e6" stroke-opacity=".22" stroke-width="2"/>
    <g transform="translate(94 102)">
      <path d="M43 174 15 204l62 4 37 35 12-47 48-14-45-22-9-62-32 45-59 8Z" fill="#b5c7f5" fill-opacity=".16" stroke="url(#cyanPurple)" stroke-width="5" stroke-linejoin="round"/>
      <path d="m105 170 44-96 62-35-35 62-96 44 25 25Z" fill="#d6e2ff" fill-opacity=".14" stroke="url(#cyan)" stroke-width="5" stroke-linejoin="round"/>
      <path d="m168 39 25 25M190 57l25 25" stroke="#c9bcff" stroke-width="9" stroke-linecap="round"/>
      <path d="M22 230c77 30 164 25 236-22" fill="none" stroke="#62e9ee" stroke-opacity=".5" stroke-width="4" filter="url(#glowCyan)"/>
    </g>
    <text x="220" y="390" text-anchor="middle" fill="#dce7ff" font-family="system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="2">PROJECTS</text>
  </g>

  <g transform="translate(120 570)" filter="url(#shadow)">
    <rect width="440" height="440" rx="104" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="2"/>
    <g clip-path="url(#iconClip)"><ellipse cx="100" cy="25" rx="270" ry="125" fill="#fff" opacity=".1" transform="rotate(-18 100 25)"/></g>
    <path d="M72 350C165 402 302 400 370 328" fill="none" stroke="#8a72ff" stroke-opacity=".22" stroke-width="2"/>
    <g transform="translate(94 114)">
      <path d="m125 17 121 49-121 49L4 66 125 17Z" fill="#dbe5ff" fill-opacity=".16" stroke="url(#cyan)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M43 83v67c44 34 120 34 164 0V83" fill="#b5c7f5" fill-opacity=".1" stroke="url(#purple)" stroke-width="5"/>
      <path d="M246 66v101" stroke="#5ce1e6" stroke-width="5"/>
      <circle cx="246" cy="179" r="11" fill="#5ce1e6" filter="url(#glowCyan)"/>
    </g>
    <text x="220" y="390" text-anchor="middle" fill="#dce7ff" font-family="system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="2">EDUCATION</text>
  </g>

  <g transform="translate(580 570)" filter="url(#shadow)">
    <rect width="440" height="440" rx="104" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="2"/>
    <g clip-path="url(#iconClip)"><ellipse cx="100" cy="25" rx="270" ry="125" fill="#fff" opacity=".1" transform="rotate(-18 100 25)"/></g>
    <path d="M72 350C165 402 302 400 370 328" fill="none" stroke="#5ce1e6" stroke-opacity=".22" stroke-width="2"/>
    <g transform="translate(98 102)">
      <path d="M43 24h45v72c0 42 27 70 67 70s67-28 67-70V24h45" fill="none" stroke="url(#cyanPurple)" stroke-width="14" stroke-linecap="round"/>
      <path d="M30 24h207M69 24v-13h129v13" stroke="#dbe7ff" stroke-opacity=".64" stroke-width="9" stroke-linecap="round"/>
      <path d="M155 166v51M91 237h128" stroke="#b8c8ed" stroke-opacity=".55" stroke-width="11" stroke-linecap="round"/>
      <path d="M112 218h86" stroke="#5ce1e6" stroke-width="7" stroke-linecap="round" filter="url(#glowCyan)"/>
    </g>
    <text x="220" y="390" text-anchor="middle" fill="#dce7ff" font-family="system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="2">ACHIEVEMENTS</text>
  </g>

  <g transform="translate(1040 570)" filter="url(#shadow)">
    <rect width="440" height="440" rx="104" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="2"/>
    <g clip-path="url(#iconClip)"><ellipse cx="100" cy="25" rx="270" ry="125" fill="#fff" opacity=".1" transform="rotate(-18 100 25)"/></g>
    <path d="M72 350C165 402 302 400 370 328" fill="none" stroke="#8a72ff" stroke-opacity=".22" stroke-width="2"/>
    <g transform="translate(88 117)">
      <rect x="12" y="26" width="256" height="155" rx="38" fill="#b5c7f5" fill-opacity=".13" stroke="url(#cyanPurple)" stroke-width="5"/>
      <path d="M12 55h256" stroke="#dbe7ff" stroke-opacity=".38" stroke-width="3"/>
      <path d="M54 85h113" stroke="#dbe7ff" stroke-opacity=".7" stroke-width="11" stroke-linecap="round"/>
      <path d="M54 124h74" stroke="#5ce1e6" stroke-width="11" stroke-linecap="round" filter="url(#glowCyan)"/>
      <path d="m215 86 13 27 29 4-21 20 5 29-26-14-26 14 5-29-21-20 29-4 13-27Z" fill="#bfa8ff" fill-opacity=".55" stroke="#d8c9ff" stroke-width="3"/>
    </g>
    <text x="220" y="390" text-anchor="middle" fill="#dce7ff" font-family="system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="2">CONTACT</text>
  </g>
</svg>
